name: CI

on:
    pull_request:
    push:
        branches:
            - master
    workflow_dispatch:

jobs:
    validation:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: [
                        '8.3',
                        '8.5'
                ]
        services:
            broker:
                image: rabbitmq:4.2-management
                env:
                    RABBITMQ_DEFAULT_USER: spryker
                    RABBITMQ_DEFAULT_PASS: secret
                    RABBITMQ_DEFAULT_VHOST: eu-docker
                ports:
                    - 5672:5672
                options: >-
                    --health-cmd "rabbitmq-diagnostics -q ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            SPRYKER_BROKER_HOST: 127.0.0.1

        steps:
            - uses: actions/checkout@v4

            - name: Validate composer.json and composer.lock
              run: composer validate

            - name: Get Composer Cache Directory
              id: composer-cache
              run: |
                  echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, intl, pdo_mysql

            - name: Composer install
              run: |
                  composer --version
                  composer install -o

            - name: Run tests
              run: composer test

            - name: PHPStan checks
              run: |
                  composer stan-setup
                  composer stan

            - name: CodeStyle checks
              run: composer cs-check


    prefer-lowest:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: [
                        '8.3'
                ]
        services:
            broker:
                image: rabbitmq:4.2-management
                env:
                    RABBITMQ_DEFAULT_USER: spryker
                    RABBITMQ_DEFAULT_PASS: secret
                    RABBITMQ_DEFAULT_VHOST: eu-docker
                ports:
                    - 5672:5672
                options: >-
                    --health-cmd "rabbitmq-diagnostics -q ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            SPRYKER_BROKER_HOST: 127.0.0.1

        steps:
            - uses: actions/checkout@v4

            - name: Validate composer.json and composer.lock
              run: composer validate

            - name: Get Composer Cache Directory
              id: composer-cache
              run: |
                  echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, intl, pdo_mysql

            - name: Composer prefer lowest
              run: composer update --prefer-lowest --prefer-stable

            - name: Run tests
              run: composer test
